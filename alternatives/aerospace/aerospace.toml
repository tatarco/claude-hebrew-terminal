# AeroSpace config — cmux-style agent workflow with WezTerm windows.
# Each WezTerm window = one agent; BiDi/Hebrew is native (no multiplexer between
# the agent and WezTerm). https://github.com/tatarco/claude-hebrew-terminal

start-at-login = false
after-startup-command = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
# New window: ALWAYS pick a project first (no more empty home shells).
#   alt-enter        -> pick project, open a shell there (prompt shows project+branch)
#   alt-p            -> pick project, launch claude there (an agent)
#   alt-shift-enter  -> escape hatch: a plain shell in home
alt-enter = 'exec-and-forget /opt/homebrew/bin/wezterm start -- /Users/galtidhar/.config/wezterm/agent-sessionizer.sh shell'
alt-p = 'exec-and-forget /opt/homebrew/bin/wezterm start -- /Users/galtidhar/.config/wezterm/agent-sessionizer.sh agent'
alt-shift-enter = 'exec-and-forget open -na WezTerm'

# Layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Focus (i3-style: h/j/k/l)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move the focused window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Workspaces 1..9 — think of each as a project / agent group
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Send the focused window to a workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Quick toggle between the last two workspaces
alt-tab = 'workspace-back-and-forth'

alt-f = 'fullscreen'
alt-shift-space = 'layout floating tiling'
alt-shift-c = 'reload-config'
alt-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'

# --- Only WezTerm tiles; everything else floats like a normal macOS window ---
# AeroSpace runs the FIRST matching rule, so WezTerm hits the tiling rule and
# stops; every other app falls through to the catch-all float rule below.
[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = 'layout tiling'

[[on-window-detected]]
run = 'layout floating'
